# Servidor ezBookkeeping con el servidor MCP activado para Claude Code, Antigravity (agy) y Codex.
#
# Uso, desde el clon principal del repositorio (no desde un worktree):
#   1. Copia ai-clients/.env.example a ai-clients/.env y define EBK_SECURITY_SECRET_KEY (ver ai-clients/README.md).
#   2. docker compose -f ai-clients/docker-compose.yml up -d --build
#
# Los secretos van en ai-clients/.env, que git ignora. No pongas tokens en este archivo.
services:
  ezbookkeeping:
    build:
      context: ..
      args:
        # Patrón de `go test -skip`, no un booleano. Omite las funciones TestExchangeRatesApi* de
        # pkg/exchangerates, que llaman a APIs externas de tipos de cambio.
        SKIP_TESTS: "TestExchangeRatesApi"
        # Heap de Node para el lint y el build del frontend (vue-tsc necesita más de 2 GB). Sin esto,
        # Node fija el heap según la memoria de la VM de Docker y el build falla con «heap out of memory»
        # cuando Docker/WSL tiene 10 GB o menos.
        BUILD_NODE_OPTIONS: "${EBK_BUILD_NODE_OPTIONS:---max-old-space-size=6144}"
    image: ezbookkeeping-ai:local
    restart: unless-stopped
    ports:
      # 127.0.0.1: tus CLI en este PC. EBK_BIND_IP: la IP 100.x de Tailscale, para el celular.
      # Si EBK_BIND_IP vale 127.0.0.1, Docker Compose deduplica la entrada.
      - "127.0.0.1:8080:8080"
      - "${EBK_BIND_IP:-127.0.0.1}:8080:8080"
    environment:
      TZ: "${TZ:-America/Bogota}"
      # Obligatoria. Sin ella, upstream firma las sesiones con su clave por defecto ("ezbookkeeping").
      EBK_SECURITY_SECRET_KEY: "${EBK_SECURITY_SECRET_KEY:?Define EBK_SECURITY_SECRET_KEY en ai-clients/.env}"
      # Nombre o IP con la que abres el servidor. Upstream lo usa en las URL absolutas de las fotos: con localhost, el celular no las verá.
      EBK_SERVER_DOMAIN: "${EBK_SERVER_DOMAIN:-localhost}"
      # URL base de esas URL absolutas. Con Tailscale Serve: http://<nombre MagicDNS>:<puerto de serve>/ (README §4).
      EBK_SERVER_ROOT_URL: "${EBK_SERVER_ROOT_URL:-%(protocol)s://%(domain)s:%(http_port)s/}"
      EBK_MCP_ENABLE_MCP: "true"
      # Permite los tokens de tipo api (userdata user-session-new -t api), que usa scripts/upload-inbox. Sin esto, upstream los rechaza.
      EBK_SECURITY_ENABLE_API_TOKEN: "${EBK_SECURITY_ENABLE_API_TOKEN:-false}"
      # IPs permitidas para MCP. Con Docker, el servidor puede ver la IP del gateway de Docker en lugar de la tuya; ver README.
      # Misma variable que lee upstream (sección [mcp], clave mcp_allowed_remote_ips): ai-clients/.env la pasa sin renombrarla.
      EBK_MCP_MCP_ALLOWED_REMOTE_IPS: "${EBK_MCP_MCP_ALLOWED_REMOTE_IPS:-127.0.0.1,172.*.*.*,192.168.65.*}"
    volumes:
      - ezbookkeeping-data:/ezbookkeeping/data
      - ezbookkeeping-storage:/ezbookkeeping/storage
      - ezbookkeeping-log:/ezbookkeeping/log

volumes:
  ezbookkeeping-data:
  ezbookkeeping-storage:
  ezbookkeeping-log:
